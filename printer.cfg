[homing_override]
axes: xyz
gcode:
    # Requested axes
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_y = home_all or 'Y' in params %}
    {% set home_z = home_all or 'Z' in params %}

    # Current homing state
    {% set x_unhomed = 'x' not in printer.toolhead.homed_axes %}
    {% set y_unhomed = 'y' not in printer.toolhead.homed_axes %}
    {% set z_unhomed = 'z' not in printer.toolhead.homed_axes %}

    # XY must be homed before Z
    {% set need_x = home_x or (home_z and x_unhomed) %}
    {% set need_y = home_y or (home_z and y_unhomed) %}

    # Homing positions
    {% set X_HOME = printer.configfile.settings['stepper_x'].position_endstop|float %}
    {% set Y_HOME = printer.configfile.settings['stepper_y'].position_endstop|float %}
    {% set X_TARGET = X_HOME + 132 %}
    {% set Y_TARGET = Y_HOME + 132 %}

    # Normal TMC currents
    {% set X_RUN_CUR = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set Y_RUN_CUR = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}

    # Sensorless homing helper
    {% macro home_axis(axis, run_current) -%}
        {% set stepper = 'stepper_' ~ axis %}
        SET_TMC_CURRENT STEPPER={stepper} CURRENT=0.7
        M400
        G28 {axis}
        G91
        G1 {axis}5 F3000
        M400
        G90
        SET_TMC_CURRENT STEPPER={stepper} CURRENT={run_current}
    {%- endmacro %}

    # Raise Z before XY homing when Z will also be homed
    {% if home_z and (need_x or need_y) %}
        {% if z_unhomed %}
            SET_KINEMATIC_POSITION Z=260 SET_HOMED=Z
            G91
            G1 Z5 F120
            G90
        {% elif printer.toolhead.position.z <= printer.toolhead.axis_maximum.z - 5 %}
            G91
            G1 Z5 F120
            G90
        {% endif %}
    {% endif %}

    # Home XY
    {% if need_x and need_y %}
        { home_axis('y', Y_RUN_CUR) }
        { home_axis('x', X_RUN_CUR) }
        { home_axis('y', Y_RUN_CUR) }
        { home_axis('x', X_RUN_CUR) }
    {% elif need_x %}
        { home_axis('x', X_RUN_CUR) }
        { home_axis('x', X_RUN_CUR) }
    {% elif need_y %}
        { home_axis('y', Y_RUN_CUR) }
        { home_axis('y', Y_RUN_CUR) }
    {% endif %}

    # Home Z
    {% if home_z %}
        # Default: 180 C for a normal/provisional Z-home.
        # PRINT_START temporarily changes this to 140 C after nozzle cleaning
        # so the load-cell establishes Z=0 with a clean, non-oozing nozzle.
       {% set Z_HOME_TEMP = printer["gcode_macro _MIPRO_START_STATE"].z_home_temp|float %}
        M106 S0
        M109 S{Z_HOME_TEMP}
        G90
        G1 X{X_TARGET} Y{Y_TARGET} F3000
        M400
        G28 Z
        G1 Z10 F300
    {% endif %}

    M400
    G90

