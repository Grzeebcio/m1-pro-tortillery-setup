[load_cell_probe]
sensor_type: cs1237
sclk_pin: THR:PB13
dout_pin: THR:PB12
sample_rate: 1280
gain: 128
#z_offset: 0.0
speed: 5
lift_speed: 5
samples: 2
sample_retract_dist: 3
samples_result: average
samples_tolerance: 0.02
samples_tolerance_retries: 10
trigger_force: 75
force_safety_limit: 500




[hall_filament_width_sensor]
adc1: THR:PB0
adc2: THR:PB1
enable: true
# The pins depend on your specific board, using thermistor or analog pins
cal_dia1: 1.46    # Diameter 1 in mm (e.g. from 2mm drill bit)
cal_dia2: 1.75    # Diameter 2 in mm (e.g. from 1.75mm filament)
raw_dia1: 482   # Raw ADC value for cal_dia1
raw_dia2: 215   # Raw ADC value for cal_dia2
default_nominal_filament_diameter: 1.75
# 90mm between sensor and hotend heatblock/nozzle - seems too much: 60mm to leave some space/avoid air printing
measurement_delay: 60 
measurement_interval: 10
logging: false
min_diameter: 1.0
pause_on_runout:true
runout_gcode:
        pause
        M118 Filament run out

 #Cutting blade
#[hall_fila_cut]
#adc1: THR:PA1
#adc2: THR:PA2
#enable: true
#logging: true



