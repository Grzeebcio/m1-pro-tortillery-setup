#        MACROS          #




# -----------------------------------------------------------------------------
# M1 Pro V4.3 + HelixScreen print-start state
# -----------------------------------------------------------------------------
[gcode_macro _MIPRO_START_STATE]
# M1 Pro V4.3 print-start state and tuning values.
# mesh_timeout_enabled:
#   0 = wait indefinitely for the HelixScreen mesh choice.
#   1 = after mesh_timeout_seconds, choose adaptive mesh automatically.
# mesh_mode:
#  -1 = not selected, 0 = saved profile 'default', 1 = adaptive mesh.
# start_phase:
#   0 = normal/idle, 1 = waiting for mesh choice, 2 = preparing the printer.
# fast_clean_enabled:
#   1 = use the new short start cleaning routine.
#   0 = fall back to the original Artillery nozzle_clean_by_liu routine.
variable_z_home_temp: 140.0
variable_mesh_timeout_enabled: 1
variable_mesh_timeout_seconds: 30
variable_mesh_prompt_delay: 2.0
variable_adaptive_margin: 5.0
variable_waiting: 0
variable_mesh_mode: -1
variable_start_phase: 0
variable_bed_temp: 0.0
variable_extruder_temp: 0.0
variable_fast_clean_enabled: 1
variable_clean_temp_offset: 15.0
variable_clean_temp_min: 230.0
variable_clean_temp_max: 250.0
variable_clean_purge_length: 55.0
variable_clean_retract: 2.0
# Final prime line after probing/mesh.  The nozzle is reheated over the waste
# chute without extrusion, then one single 50 mm line is drawn at the front.
variable_prime_line_x: 20.0
variable_prime_line_y: 5.0
variable_prime_safe_x: 200.0
variable_prime_line_z: 0.25
variable_prime_line_length: 50.0
variable_prime_line_unretract: 1.5
variable_prime_line_extrusion: 2.5
variable_prime_line_speed: 1200.0
gcode:
    G4 P0


[gcode_macro _MIPRO_PROMPT_TEST_OK]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="HelixScreen prompt OK."
    M117 Helix prompt OK


[gcode_macro TEST_HELIX_PROMPT]
description: Harmless test of the Klipper prompt protocol in HelixScreen
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Prueba HelixScreen"
    RESPOND TYPE=command MSG="action:prompt_text Si ves este cuadro, HelixScreen recibe correctamente los prompts de Klipper."
    RESPOND TYPE=command MSG="action:prompt_footer_button OK|_MIPRO_PROMPT_TEST_OK|primary"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro PRINT_START]
description: M1 Pro V4.3 - ask mesh first, then prepare/clean/probe, front prime line and start print
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}

    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
    CLEAR_PAUSE
    UPDATE_DELAYED_GCODE ID=_MIPRO_BED_MESH_TIMEOUT DURATION=0
    UPDATE_DELAYED_GCODE ID=_MIPRO_SHOW_MESH_PROMPT DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"

    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=waiting VALUE=1
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=mesh_mode VALUE=-1
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=start_phase VALUE=1
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=bed_temp VALUE={BED_TEMP}
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=extruder_temp VALUE={EXTRUDER_TEMP}
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=z_home_temp VALUE=140



    G90
    M83
    G92 E0
    M220 S100
    M221 S100
    M106 S0

    # Ask immediately, before heating, homing or cleaning.  The selected mode is
    # only stored here; the actual mesh is performed later, after the clean 140 C Z-home.
    {% set SKIP_BED_MESH = params.SKIP_BED_MESH|default(0)|int %}
    {% if SKIP_BED_MESH == 0 %}
      _MIPRO_ASK_BED_MESH
    {% endif %}

[gcode_macro _MIPRO_ASK_BED_MESH]
description: Pause virtual-SD immediately, then show the known-working Helix prompt after a short UI delay
gcode:
    {% set state = printer["gcode_macro _MIPRO_START_STATE"] %}
    {% set prompt_delay = state.mesh_prompt_delay|float %}

    RESPOND MSG="M1 V4.2: pausando archivo; Helix mostrara la seleccion de Bed Mesh en {prompt_delay} s."
    M117 Selecciona Bed Mesh

    # At the very first instant of a print HelixScreen is still changing from the
    # file/preview screen to the active print screen.  Mainsail already listens,
    # but Helix can miss a prompt emitted synchronously in PRINT_START.
    # Pause the virtual-SD file now and emit the prompt from delayed_gcode once
    # Helix is already in the print screen.
    UPDATE_DELAYED_GCODE ID=_MIPRO_SHOW_MESH_PROMPT DURATION={prompt_delay}
    M25


[delayed_gcode _MIPRO_SHOW_MESH_PROMPT]
gcode:
    {% set state = printer["gcode_macro _MIPRO_START_STATE"] %}
    {% set timeout_enabled = state.mesh_timeout_enabled|int %}
    {% set timeout_seconds = state.mesh_timeout_seconds|int %}

    {% if state.waiting|int == 1 and state.start_phase|int == 1 %}
        RESPOND MSG="M1 V4.2: mostrando selector de Bed Mesh."

        # IMPORTANT: this is intentionally the SAME prompt syntax that was used
        # in config-20261007-180551, where it is confirmed to render correctly
        # on this HelixScreen installation.
        RESPOND TYPE=command MSG="action:prompt_begin Bed Mesh"
        RESPOND TYPE=command MSG="action:prompt_text Elige ahora la malla para esta impresion. La preparacion empezara despues de tu eleccion."
        {% if timeout_enabled == 1 %}
            RESPOND TYPE=command MSG="action:prompt_text Si no eliges en {timeout_seconds} segundos, se seleccionara Mesh adaptativa automaticamente."
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_text La impresora esperara hasta que elijas una opcion."
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Mesh adaptativa|_MIPRO_BED_MESH_SELECT MESH=1|primary"
        RESPOND TYPE=command MSG="action:prompt_button Usar mesh guardada|_MIPRO_BED_MESH_SELECT MESH=0|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"

        # Start the 30 s fallback only after the dialog has actually been sent.
        {% if timeout_enabled == 1 %}
            UPDATE_DELAYED_GCODE ID=_MIPRO_BED_MESH_TIMEOUT DURATION={timeout_seconds}
        {% endif %}
    {% endif %}


[gcode_macro _MIPRO_BED_MESH_SELECT]
description: Store the early mesh choice and start printer preparation
gcode:
    {% set state = printer["gcode_macro _MIPRO_START_STATE"] %}
    {% set do_mesh = params.MESH|default(1)|int %}

    {% if state.waiting|int == 1 and state.start_phase|int == 1 %}
        UPDATE_DELAYED_GCODE ID=_MIPRO_BED_MESH_TIMEOUT DURATION=0
        UPDATE_DELAYED_GCODE ID=_MIPRO_SHOW_MESH_PROMPT DURATION=0
        SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=waiting VALUE=0
        SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=mesh_mode VALUE={do_mesh}
        SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=start_phase VALUE=2
        RESPOND TYPE=command MSG="action:prompt_end"

        {% if do_mesh == 1 %}
            RESPOND MSG="M1 V4: Mesh adaptativa seleccionada. Iniciando preparacion..."
            M117 Adaptive seleccionada
        {% else %}
            RESPOND MSG="M1 V4: Mesh guardada seleccionada. Iniciando preparacion..."
            M117 Default seleccionada
        {% endif %}

        _MIPRO_PREPARE_PRINT
    {% else %}
        RESPOND MSG="Bed Mesh: seleccion ignorada; no hay una pregunta pendiente."
    {% endif %}


[gcode_macro _MIPRO_PREPARE_PRINT]
description: Heat, home safely, fast-clean, establish final Z, apply selected mesh and prime
gcode:
    {% set state = printer["gcode_macro _MIPRO_START_STATE"] %}
    {% set bed_temp = state.bed_temp|float %}
    {% set print_temp = state.extruder_temp|float %}
    {% set mesh_mode = state.mesh_mode|int %}
    {% set margin = state.adaptive_margin|float %}
    {% set z_is_homed = 'z' in printer.toolhead.homed_axes %}

    # Heat in parallel with homing/cleaning.  180 C is only the provisional Z-home temp.
    M140 S{bed_temp}
    M104 S180
    M106 S0
    M220 S100
    M221 S100

    # XY is re-homed every print.  A provisional Z-home is performed only when
    # Klipper has no valid Z reference.  If Z is already homed, lift 5 mm and keep it.
    {% if not z_is_homed %}
        RESPOND MSG="M1 V4: Z no referenciado; haciendo G28 XYZ provisional a 140 C."
        SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=z_home_temp VALUE=140
        G28
    {% else %}
        RESPOND MSG="M1 V4: Z ya referenciado; omitiendo Z-home provisional y rehaciendo solo XY."
        {% if printer.toolhead.position.z <= printer.toolhead.axis_maximum.z - 5 %}
            G91
            G1 Z5 F300
            G90
        {% endif %}
        G28 X Y
    {% endif %}

    # Use the short normal cleaning sequence.  The original Artillery routine is
    # preserved and can be restored with fast_clean_enabled=0 for a deep clean.
    {% if state.fast_clean_enabled|int == 1 %}
        _MIPRO_CLEAN_FAST PRINT_TEMP={print_temp}
    {% else %}
        RESPOND MSG="M1 V4: usando limpieza OEM profunda."
        G90
        G1 Z10 F1800
        _move_to_collection_box_no_g28
        nozzle_clean_by_liu
    {% endif %}

    # Final load-cell reference only after the real bed temperature is reached and
    # the nozzle has been cleaned/sealed at 140 C.
    M190 S{bed_temp}
    M106 S0
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=z_home_temp VALUE=140
    G28 Z
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=z_home_temp VALUE=140

    G90
    G1 Z10 F1800

    # Apply the choice made at the very beginning.  Adaptive mesh is generated only
    # now, after the clean final Z-home; the saved full-bed 'default' remains untouched.
    BED_MESH_CLEAR
    {% if mesh_mode == 1 %}
        RESPOND MSG="M1 V4: generando mesh adaptativa..."
        M117 Mesh adaptativa
        BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1 ADAPTIVE_MARGIN={margin}
    {% else %}
        RESPOND MSG="M1 V4: cargando perfil guardado 'default'..."
        M117 Mesh guardada
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    _MIPRO_FINAL_PRIME_AND_RESUME


[gcode_macro _MIPRO_CLEAN_FAST]
description: Short normal start clean; one purge, waste flick, brush and 140 C nozzle seal
gcode:
    {% set state = printer["gcode_macro _MIPRO_START_STATE"] %}
    {% set print_temp = params.PRINT_TEMP|default(state.extruder_temp)|float %}
    {% set clean_temp = print_temp + state.clean_temp_offset|float %}
    {% set clean_min = state.clean_temp_min|float %}
    {% set clean_max = state.clean_temp_max|float %}
    {% set purge = state.clean_purge_length|float %}
    {% set retract = state.clean_retract|float %}
    {% if clean_temp < clean_min %}
        {% set clean_temp = clean_min %}
    {% endif %}
    {% if clean_temp > clean_max %}
        {% set clean_temp = clean_max %}
    {% endif %}

    RESPOND MSG="M1 V4: limpieza rapida a {clean_temp|int} C, purga {purge|int} mm."
    M117 Limpieza rapida

    # Known Z reference is required for the brush/seal geometry.
    G90
    G1 Z10 F1800
    _move_to_collection_box_no_g28

    # One purge instead of the OEM triple 250/230/220 C cycle.
    M109 S{clean_temp}
    M83
    G92 E0
    G1 E{purge} F300
    G1 E-{retract} F1200
    M400

    # Start cooling immediately and flick the single purge into the waste chute.
    M104 S180
    M106 S160
    G4 P800
    G1 X170 Y275 F30000
    G1 X138 Y275 F3000
    G1 X170 Y275 F30000
    G1 X138 Y275 F3000
    M400

    # One complete out-and-back pass over the existing M1 Pro brush path.
    M106 S255
    G1 X153 Y275 Z3 F2000
    G1 X153 Y275 Z0 F2400
    G1 X159 Y264 Z0 F3000
    G1 X168 Y275 Z0 F3000
    G1 X177 Y264 Z0 F3000
    G1 X186 Y275 Z0 F3000
    G1 X177 Y264 Z0 F3000
    G1 X168 Y275 Z0 F3000
    G1 X159 Y264 Z0 F3000
    G1 X153 Y275 Z0 F3000
    G1 Z3 F300
    M400

    # Keep the useful OEM seal/cool step: hold the nozzle against the cleaning PEI
    # while cooling to 140 C so a fresh ooze droplet is not present for load-cell Z.
    M106 S200
    M104 S180
    G1 X193 Y269 Z2 F3000
    G1 X193 Y269 Z1 F1000
    G1 X200 Y269 Z0 F80
    G1 X205 Y269 Z0 F80
    M400
    G1 X205 Y269 Z-0.2 F60
    M109 S140
    G1 X215 Y269 Z1 F600
    G1 Z5 F3000
    M400
    M106 S0


[gcode_macro _MIPRO_FINAL_PRIME_AND_RESUME]
description: Reheat over waste chute, draw one 50 mm front prime line, reset overrides and resume
gcode:
    {% set state = printer["gcode_macro _MIPRO_START_STATE"] %}
    {% set print_temp = state.extruder_temp|float %}
    {% set prime_x = state.prime_line_x|float %}
    {% set prime_y = state.prime_line_y|float %}
    {% set prime_safe_x = state.prime_safe_x|float %}
    {% set prime_z = state.prime_line_z|float %}
    {% set prime_len = state.prime_line_length|float %}
    {% set prime_unretract = state.prime_line_unretract|float %}
    {% set prime_e = state.prime_line_extrusion|float %}
    {% set prime_speed = state.prime_line_speed|float %}
    {% set prime_end_x = prime_x + prime_len %}

    RESPOND TYPE=command MSG="action:prompt_end"
    M106 S0

    # All load-cell probing is already finished.  Reheat over the waste chute so
    # any passive ooze falls outside the bed, but DO NOT extrude/purge here.
    G90
    G1 Z10 F1800
    _move_to_collection_box_no_g28
    M104 S{print_temp}
    M109 S{print_temp}

    # Leave the rear waste chute through the known-safe right-side corridor.
    # IMPORTANT: do not move diagonally from X137 Y275 to the front: the M1 Pro
    # has a plastic obstruction in that path.  X200 is already used by the OEM
    # collection-box route, so reverse that safe geometry first, then go front.
    M83
    G1 X{prime_safe_x} F6000
    G1 Y{prime_y} F12000
    G1 X{prime_x} F12000
    G1 Z5 F1200
    G1 Z{prime_z} F600
    G92 E0
    # Recover most of the 2 mm cleaning retract; this is not a second purge line.
    G1 E{prime_unretract} F180
    G1 X{prime_end_x} Y{prime_y} E{prime_e} F{prime_speed}
    G1 Z0.6 F600
    G92 E0
    M400

    # Eliminate any manual speed/flow overrides immediately before the sliced file resumes.
    # NOTE: the enabled hall_filament_width_sensor may subsequently alter extrusion factor.
    M220 S100
    M221 S100

    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=start_phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=mesh_mode VALUE=-1
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=waiting VALUE=0

    M117 Printing
    RESPOND MSG="M1 V4.3: linea frontal 50 mm completada; reanudando G-code a {print_temp|int} C."
    M24


[delayed_gcode _MIPRO_BED_MESH_TIMEOUT]
gcode:
    {% set state = printer["gcode_macro _MIPRO_START_STATE"] %}
    {% if state.waiting|int == 1 and state.start_phase|int == 1 %}
        RESPOND MSG="Bed Mesh: timeout; se selecciona mesh adaptativa."
        M117 Timeout: adaptive
        _MIPRO_BED_MESH_SELECT MESH=1
    {% endif %}


[gcode_macro PRINT_END]
gcode:
    UPDATE_DELAYED_GCODE ID=_MIPRO_BED_MESH_TIMEOUT DURATION=0
    UPDATE_DELAYED_GCODE ID=_MIPRO_SHOW_MESH_PROMPT DURATION=0
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=waiting VALUE=0
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=start_phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=mesh_mode VALUE=-1
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    # {% set RUN_DECEL    = printer.configfile.settings['printer'].max_accel_to_decel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL} #ACCEL_TO_DECEL={RUN_DECEL}
    M220 S100
    M221 S100
    {% set z = params.Z|default(100)|int %}
    {% if (printer.gcode_move.position.z+5) < z %}
    G90 							            ; absolute positioning
    G1 Z{z+5} F6000 				      ; park nozzle at rear
    {% endif %}
    TURN_OFF_HEATERS
    M107
    M84


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
      UPDATE_DELAYED_GCODE ID=_MIPRO_BED_MESH_TIMEOUT DURATION=0
      UPDATE_DELAYED_GCODE ID=_MIPRO_SHOW_MESH_PROMPT DURATION=0
      SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=waiting VALUE=0
      SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=start_phase VALUE=0
      SET_GCODE_VARIABLE MACRO=_MIPRO_START_STATE VARIABLE=mesh_mode VALUE=-1
      RESPOND TYPE=command MSG="action:prompt_end"
      {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
      {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
      # {% set RUN_DECEL    = printer.configfile.settings['printer'].max_accel_to_decel|float %}
      SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL} #ACCEL_TO_DECEL={RUN_DECEL}
      {% set z = params.Z|default(100)|int %}  
      {% set x_park = params.X|default(printer.toolhead.axis_minimum.x+5)|int %} 
      {% set y_park = params.Y|default(printer.toolhead.axis_minimum.y+5)|int %} 
      SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} 
      SDCARD_RESET_FILE
      M400
      M220 S100
      M221 S100
      G91
      M83
      G1 E-1.0 F1200
      TURN_OFF_HEATERS
      M106 S0
      M141 S0
      M106 P2 S0
      M106 P1 S0
      M106 P3 S0
      M107
            # Podniesienie osi Z
      G90
      {% set z_safe = [printer.gcode_move.position.z + 5, printer.toolhead.axis_maximum.z]|min %}
      G1 Z{z_safe} F600

            # Najpierw podniesienie osi Z
      G90
      {% set z_safe = [printer.gcode_move.position.z + 5, printer.toolhead.axis_maximum.z]|min %}
      G1 Z{z_safe} F600
      M400

      # Bezpieczny wyjazd ze strefy zsypni
      {% if printer.gcode_move.position.y >= 275
            and printer.gcode_move.position.x >= 130
            and printer.gcode_move.position.x < 207 %}
          G1 X207 F3000
          M400
      {% endif %}

      # Dopiero teraz przejazd do pozycji koncowej
      G1 X{x_park} Y{y_park} F6000
      M400

      # Wylaczenie silnikow
      M84




[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    M400 
    {% set z = params.Z|default(30)|int %}                                                   
    {% set E = (params.E|default(2))|float %}
    {% set x_park = params.X|default(200)|int %} 
    {% set y_park = params.Y|default(276)|int %} 
                                                                                  
    {% if (printer.gcode_move.position.x) <= (x_park+1) and (printer.gcode_move.position.y) >= (y_park-1) %}
      M400
    {% else %}
      {% set position = printer.gcode_move.gcode_position %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_x VALUE="{position.x}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_y VALUE="{position.y}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z VALUE="{position.z}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_e VALUE="{E}"
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}   
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_temp VALUE={printer['heater_bed'].target}  
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=sfan VALUE={printer["fan_generic _Secondary_Fan"].speed*255} 
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=afan VALUE={printer["fan_generic auxiliary_fan"].speed*255}
        SAVE_GCODE_STATE NAME=timelapse_state_a
        M83
        G91
      {% if (printer.gcode_move.position.z+5) <  printer.toolhead.axis_maximum.z  %}
        G1 E-2 X3 Z1 F2100
        G1 Z4 F600
      {% endif %}
        SAVE_GCODE_STATE NAME=timelapse_state_b
        G90
      {% if (printer.gcode_move.position.z+5) < z %}
        G1 Z{z+5} X{x_park} Y{y_park}  F6000
        G1 X{x_park-66} Y{y_park} E-1 F6000 
      {% else %}
        G1 X{x_park} Y{y_park} F6000
        G1 X{x_park-66} Y{y_park} E-1 F6000 
      {% endif %}
        M400
        M25
        SET_IDLE_TIMEOUT TIMEOUT=86400
        M400
        M104 S140
        M106 S0
        M106 P2 S0
    {% endif %}
                                                           




[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
variable_bed_temp: 0
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
variable_saved_e: 0.0
variable_sfan: 0.0
variable_afan: 0.0
gcode:
    {% if printer["gcode_macro _MIPRO_START_STATE"].start_phase|int > 0 %}
        RESPOND TYPE=error MSG="El inicio automatico M1 V4 sigue en curso. No reanudes manualmente."
    {% else %}

        # Przywrocenie czasu bezczynnosci
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

        # Nagrzewanie dyszy do zapisanej temperatury
        {% if etemp > 0 %}
            M109 S{etemp|int}
        {% endif %}

        # Ekstruzja wzgledna
        M83

        # Wypchniecie 10 mm filamentu zamiast 50 mm
        M106 S100
        G4 P1000
        G1 E10 F600
        M400

        # Nadmuch po ekstruzji
        M106 S255
        G4 P1000
        M106 S0

        # Czyszczenie dyszy w strefie zsypni
        G90
        G4 P1000
        G1 X149 Y276 F6000
        G1 X140 Y276 F3000
        G1 X160 Y276 F6000
        G1 X140 Y276 F3000
        G1 X149 Y276 F6000

        # Bezpieczny wyjazd ze zsypni tylko w osi X
        G1 X207 F3000
        M400

        # Powrot na podniesiona pozycje sprzed parkowania
        RESTORE_GCODE_STATE NAME=timelapse_state_b MOVE=1 MOVE_SPEED=100

        # Przywrocenie wentylatorow
        M106 S{sfan}
        M106 P2 S{afan}

        # Powrot do dokladnego miejsca przerwania
        RESTORE_GCODE_STATE NAME=timelapse_state_a MOVE=1 MOVE_SPEED=60

        # Wznowienie pliku
        M24

    {% endif %}


[gcode_macro M141]
# rename_existing: m1416
gcode:
    {% set s = params.S|float %}
    {% set temp = (params.S|default(0)|int,0)|max %}
    {% if temp>0 %}
      # SET_FAN_SPEED FAN=_ptc_fan SPEED=1
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET="{temp}"
    {% else %}
      # SET_FAN_SPEED FAN=_ptc_fan SPEED=0
      SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
    {% endif %}

[gcode_macro M191]
gcode:
    {% set s = params.S|float %}
    {% if s == 0 %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={s}
        M106 P1 S0
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={s}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={s-2} MAXIMUM={s+2}
        M106 P1 S255
    {% endif %}


[gcode_macro M106]
rename_existing: M1066
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
    {% if 'fan0' in fan %}
       M1066 S{speed*255}
       SET_FAN_SPEED FAN=_Secondary_Fan SPEED={speed}
    {% elif 'fan2' in fan %}
       SET_FAN_SPEED FAN=auxiliary_fan SPEED={speed}
    {% elif 'fan1' in fan %}
      #  SET_FAN_SPEED FAN=_ptc_fan SPEED={speed}
    {% elif 'fan3' in fan %}
       SET_FAN_SPEED FAN=filter_fan SPEED={speed}
    {% endif %}

